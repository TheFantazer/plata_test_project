services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: plata
      POSTGRES_PASSWORD: plata
      POSTGRES_DB: plata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plata -d plata"]
      interval: 5s
      timeout: 3s
      retries: 10
  app:
    build: .
    restart: on-failure
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://plata:plata@db:5432/plata?sslmode=disable"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
  migrate:
    image: migrate/migrate:v4.19.1
    volumes:
      - ./migrations:/migrations:ro
    command:
      - -path=/migrations
      - -database=postgres://plata:plata@db:5432/plata?sslmode=disable
      - up
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
